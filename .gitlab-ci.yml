stages: [fast, full, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags: [layrs, fast, x86]
  before_script:
    - export PATH="/home/gitlab-runner/.cargo/bin:$PATH"
    - export RUSTUP_HOME=/home/gitlab-runner/.rustup
    - export CARGO_HOME="$CI_PROJECT_DIR/.cargo-cache"
    - rustc --version
    - cargo --version
  cache:
    key: { files: [Cargo.lock] }
    paths: [.cargo-cache/registry/, .cargo-cache/git/]

clob-fast:
  stage: fast
  timeout: 90m
  script:
    - scripts/run-enclave-snapshot-ci-guard.sh
    - cargo fmt --check
    - cargo check --all-targets --locked
    - cargo test --locked --lib
    - cargo test --locked --manifest-path proofs/settlement/core/Cargo.toml
    - RISC0_SKIP_BUILD=1 cargo test --locked --manifest-path proofs/settlement/host/Cargo.toml
    - cargo test --locked --test settlement_equivalence
    - npm audit --omit=dev --audit-level=high --prefix proofs/settlement/zkverify
    - npm ci --ignore-scripts --prefix proofs/settlement/worker
    - npm test --prefix proofs/settlement/worker
    - npm audit --omit=dev --audit-level=high --prefix proofs/settlement/worker
    - >-
      cargo clippy --all-targets --locked -- -D warnings
      -A dead-code
      -A clippy::too-many-arguments
      -A clippy::type-complexity
      -A clippy::large-enum-variant
      -A clippy::needless-range-loop
      -A clippy::empty-line-after-doc-comments
      -A clippy::wrong-self-convention
      -A clippy::enum-variant-names

clob-full:
  stage: full
  timeout: 2h
  needs: [clob-fast]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cargo test --locked -- --test-threads=1
    - cargo test --locked --manifest-path enclave/runtime/Cargo.toml
    - cargo test --locked --manifest-path enclave/parent-runtime/Cargo.toml
    - docker build --file Dockerfile.zk-proof-worker --tag "layrs-zk-proof-worker:${CI_COMMIT_SHA}" .
    - docker run --rm --entrypoint /opt/risc0/bin/r0vm "layrs-zk-proof-worker:${CI_COMMIT_SHA}" --version
    - command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
    - ./scripts/audit-enclave-dependencies.sh

deploy-zk-proof-worker:
  stage: deploy
  tags: [layrs, deploy, x86]
  interruptible: false
  needs: [clob-full]
  resource_group: production-zk-proof-worker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  variables:
    LAYRSV2_AWS_ROLE_ARN: arn:aws:iam::255638996474:role/layrsv2-production-deployer
    LAYRSV2_PRIMARY_REGION: us-east-1
    LAYRSV2_ENVIRONMENT: production
  script:
    - deployment/deploy-zk-proof-worker.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - deployment/releases/zk-proof-worker-${CI_COMMIT_SHA}.json
  environment:
    name: production-zk-proof-worker
