[package]
name = "layrs-clob-service"
version = "0.1.0"
edition = "2021"
authors = ["Layrs Team"]

[lib]
name = "clob_service"
path = "src/lib.rs"

[[bin]]
name = "layrs-clob-service"
path = "src/main.rs"

[features]
test-helpers = []

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Redis client with TLS via native-tls (OpenSSL)
# Enable tokio-native-tls compatibility to provide the async TLS connector required by redis when using tokio runtime.
redis = { version = "0.26.1", features = ["aio", "tokio-comp", "connection-manager", "tls-native-tls", "tokio-native-tls-comp"] }

# WebSocket
futures-util = "0.3"

# UUID and Time
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Decimal arithmetic (critical for financial calculations)
rust_decimal = { version = "1.35", features = ["serde-float"] }
rust_decimal_macros = "1.35"

# Ethereum integration
ethers = { version = "2.0", features = ["rustls", "ws"] }
hex = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "migrate", "rust_decimal"] }

# ZK / hashing
tiny-keccak = { version = "2.0", features = ["keccak"] }
ark-bn254 = "0.4"
ark-ff = "0.4"
light-poseidon = "0.2"
num-bigint = "0.4"
num-traits = "0.2"

# Metrics and observability
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
dotenvy = "0.15"
config = "0.14"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Explicitly include tokio-native-tls to satisfy linker/type expectations when using redis tls-native-tls on tokio
tokio-native-tls = "0.3"

# Utilities
dashmap = "6.0"
parking_lot = "0.12"
bytes = "1.7"
rand = "0.8"
tempfile = "3"
aes-gcm = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
mini-redis = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
