name: layrsv2 confidential core CI

on:
  pull_request:
  push:
    branches: [main]

permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enclave snapshot compatibility guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="HEAD^"
            fi
          fi
          scripts/check-enclave-snapshot-compatibility.sh --base "$base" --mode ci
      - run: cargo fmt --check
      - run: cargo check --all-targets --locked
      - run: cargo test --locked
      - run: cargo test --locked --manifest-path enclave/runtime/Cargo.toml
      - run: cargo test --locked --manifest-path enclave/parent-runtime/Cargo.toml
      - name: Clippy (strict, with documented legacy structural exceptions)
        run: >-
          cargo clippy --all-targets --locked -- -D warnings
          -A dead-code
          -A clippy::too-many-arguments
          -A clippy::type-complexity
          -A clippy::large-enum-variant
          -A clippy::needless-range-loop
          -A clippy::empty-line-after-doc-comments
          -A clippy::wrong-self-convention
          -A clippy::enum-variant-names
      - run: cargo install cargo-audit --locked
      - name: Audit production EIF dependencies
        run: cargo audit --file enclave/runtime/Cargo.lock
      - name: Audit production parent dependencies
        run: cargo audit --file enclave/parent-runtime/Cargo.lock
