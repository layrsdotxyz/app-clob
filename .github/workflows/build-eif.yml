name: layrsv2 signed EIF reference

on:
  workflow_dispatch:
    inputs:
      snapshot_compat_base:
        description: Currently deployed app-clob release commit to compare against before building the EIF
        required: true
        type: string
      allow_state_schema_change:
        description: Allow private-core snapshot/schema changes only with a migration approval document
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions: { contents: read, id-token: write, attestations: write }

jobs:
  build:
    runs-on: [self-hosted, linux, x64, nitro-builder]
    environment: production-enclave-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.94.0' }
      - name: Enclave snapshot compatibility guard
        shell: bash
        env:
          SNAPSHOT_COMPAT_BASE: ${{ inputs.snapshot_compat_base }}
          ALLOW_STATE_SCHEMA_CHANGE: ${{ inputs.allow_state_schema_change }}
        run: |
          args=(--base "$SNAPSHOT_COMPAT_BASE" --mode release)
          if [[ "$ALLOW_STATE_SCHEMA_CHANGE" == "true" ]]; then
            args+=(--allow-state-schema-change)
          fi
          scripts/check-enclave-snapshot-compatibility.sh "${args[@]}"
      - name: Audit locked production artifacts
        run: |
          cargo install cargo-audit --locked
          cargo audit --file enclave/runtime/Cargo.lock
          cargo audit --file enclave/parent-runtime/Cargo.lock
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ vars.LAYRSV2_ENCLAVE_RELEASE_ROLE_ARN }}', aws-region: '${{ vars.LAYRSV2_PRIMARY_REGION }}' }
      - name: Build reproducible EIF
        env:
          LAYRS_OPERATOR_PUBLIC_KEY_HEX: ${{ vars.LAYRSV2_OPERATOR_PUBLIC_KEY_HEX }}
          LAYRS_EIF_OUTPUT: build/layrsv2-clob.eif
          LAYRS_MEASUREMENT_OUTPUT: build/layrsv2-clob-measurements.json
        run: enclave/build-eif.sh
      - run: sha384sum build/layrsv2-clob.eif > build/layrsv2-clob.eif.sha384
      - uses: actions/upload-artifact@v4
        with: { name: 'layrsv2-eif-${{ github.sha }}', path: build/layrsv2-clob*, if-no-files-found: error, retention-days: 90 }
