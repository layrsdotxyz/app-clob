AWSTemplateFormatVersion: '2010-09-09'
Description: Dormant Layrs direct-execution Nitro parent. It intentionally creates no writer route or running capacity.
Parameters:
  VpcId: { Type: AWS::EC2::VPC::Id }
  PrivateSubnetId: { Type: AWS::EC2::Subnet::Id }
  BffSecurityGroupId: { Type: AWS::EC2::SecurityGroup::Id }
  # No default: the governed deployment must explicitly supply an AMI that is
  # registered in the target region and matches the signed grant's EIF/PCRs.
  CandidateAmiId: { Type: AWS::EC2::Image::Id }
  ArchiveBucketArn: { Type: String }
  ArchiveBucketName: { Type: String }
  ArchiveKmsKeyArn: { Type: String }
  ArchivePrefix: { Type: String, AllowedPattern: '^[A-Za-z0-9!_.*''()/-]+$' }
  ArchiveRetentionSeconds: { Type: Number, MinValue: 1 }
  AlertTopicArn: { Type: String }
  # These are references only.  No secret value is passed through
  # CloudFormation, EC2 user data, instance tags, or logs.
  RuntimeSecretArn: { Type: String }
  RpcSecretArn: { Type: String }
  OperationalIdentityKmsKeyArn: { Type: String }
  BasePoolAddress: { Type: String, AllowedPattern: '^0x[0-9a-fA-F]{40}$' }
  BaseConfirmations: { Type: Number, MinValue: 1 }
Resources:
  RuntimeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /layrs/direct-execution/runtime, RetentionInDays: 365 }
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: 'sts:AssumeRole' }]
      Policies:
        - PolicyName: direct-runtime-dormant-archive-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:GetBucketObjectLockConfiguration, s3:GetObjectRetention, s3:PutObjectRetention]
                Resource: [!Ref ArchiveBucketArn, !Sub '${ArchiveBucketArn}/*']
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !Ref ArchiveKmsKeyArn
              # The dormant runtime may retrieve exactly the two existing
              # operational configuration objects it needs.  It cannot list,
              # create, update, rotate, or delete Secrets Manager objects.
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref RuntimeSecretArn, !Ref RpcSecretArn]
              # The RPC configuration secret uses this existing CMK.  The
              # context/service condition prevents its use as a general KMS
              # decrypt capability.
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !Ref OperationalIdentityKmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                    kms:EncryptionContext:SecretARN: !Ref RpcSecretArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt RuntimeLogGroup.Arn
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
  RuntimeProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref RuntimeRole] }
  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Direct runtime accepts only BFF health and command traffic
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8443, ToPort: 8443, SourceSecurityGroupId: !Ref BffSecurityGroupId }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
  DormantLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref CandidateAmiId
        InstanceType: m6i.xlarge
        IamInstanceProfile: { Arn: !GetAtt RuntimeProfile.Arn }
        SecurityGroupIds: [!Ref RuntimeSecurityGroup]
        EnclaveOptions: { Enabled: true }
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # The process obtains secret values only in memory and writes a
            # root-only EnvironmentFile.  It never emits a value to stdout,
            # stderr, CloudFormation, EC2 metadata, or a tag.
            set -euo pipefail
            install -d -m 0700 /etc/layrs-opening
            /usr/bin/python3 - <<'PY'
            import json
            import os
            import subprocess
            import tempfile

            def secret(secret_arn):
                raw = subprocess.check_output(
                    ["aws", "secretsmanager", "get-secret-value", "--region", "${AWS::Region}",
                     "--secret-id", secret_arn, "--query", "SecretString", "--output", "text"],
                    stderr=subprocess.DEVNULL,
                    text=True,
                )
                value = json.loads(raw)
                if not isinstance(value, dict):
                    raise RuntimeError("secret object required")
                return value

            def required(value, key):
                item = value.get(key)
                if not isinstance(item, str) or not item:
                    raise RuntimeError("required runtime secret field unavailable")
                return item

            runtime = secret("${RuntimeSecretArn}")
            rpc = secret("${RpcSecretArn}")
            values = {
                "LAYRS_DIRECT_EXECUTION_MODE": "dormant",
                "LAYRS_DIRECT_CUSTODY_PROVIDER": "privy-base-existing-pool-ledger",
                "LAYRS_DIRECT_ARCHIVE_BACKEND": "s3",
                "LAYRS_DIRECT_ARCHIVE_BUCKET": "${ArchiveBucketName}",
                "LAYRS_DIRECT_ARCHIVE_PREFIX": "${ArchivePrefix}",
                "LAYRS_DIRECT_ARCHIVE_KMS_KEY_ID": "${ArchiveKmsKeyArn}",
                "LAYRS_DIRECT_ARCHIVE_RETENTION_SECONDS": "${ArchiveRetentionSeconds}",
                "LAYRSV2_BASE_POOL_ADDRESS": "${BasePoolAddress}",
                "LAYRSV2_BASE_CONFIRMATIONS": "${BaseConfirmations}",
                "LAYRSV2_PRIVY_APP_ID": required(runtime, "privyAppId"),
                "LAYRSV2_PRIVY_APP_SECRET": required(runtime, "privyAppSecret"),
                "LAYRSV2_BASE_POOL_LEDGER_PRIVY_WALLET_ID": required(runtime, "basePoolLedgerPrivyWalletId"),
                "LAYRSV2_BASE_POOL_LEDGER_PRIVY_ADDRESS": required(runtime, "basePoolLedgerPrivyAddress"),
                "LAYRSV2_BASE_POOL_LEDGER_PRIVY_AUTH_PRIVATE_KEY_PEM": required(runtime, "basePoolLedgerPrivyAuthPrivateKeyPem"),
                "LAYRSV2_BASE_RPC_URL": required(rpc, "baseRpcUrl"),
            }
            def quote(value):
                return '"' + value.replace('\\\\', '\\\\\\\\').replace('"', '\\\\"').replace('\n', '\\n') + '"'
            fd, temporary = tempfile.mkstemp(prefix="direct-runtime.", dir="/etc/layrs-opening")
            try:
                with os.fdopen(fd, "w", encoding="utf-8") as out:
                    for key, value in values.items():
                        out.write(key + "=" + quote(value) + "\n")
                    out.flush()
                    os.fsync(out.fileno())
                os.chmod(temporary, 0o600)
                os.replace(temporary, "/etc/layrs-opening/direct-runtime.env")
            finally:
                if os.path.exists(temporary):
                    os.unlink(temporary)
            PY
            systemctl restart layrs-opening-enclave.service
            systemctl restart layrs-opening-parent.service
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Project, Value: Layrs }, { Key: Environment, Value: production-dormant }, { Key: WriterEnabled, Value: 'false' }, { Key: TransactionModel, Value: layrs.direct-execution.v1 }, { Key: CandidateAmiId, Value: !Ref CandidateAmiId }]
  DormantAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: [!Ref PrivateSubnetId]
      LaunchTemplate: { LaunchTemplateId: !Ref DormantLaunchTemplate, Version: !GetAtt DormantLaunchTemplate.LatestVersionNumber }
      MinSize: '0'
      MaxSize: '1'
      DesiredCapacity: '0'
      Tags: [{ Key: WriterEnabled, Value: 'false', PropagateAtLaunch: true }]
  RuntimeHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: layrs-production-direct-runtime-health-missing
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopicArn]
