AWSTemplateFormatVersion: '2010-09-09'
Description: Governed Layrs direct-execution Nitro runtime. Defaults dormant and writer-disabled.
Parameters:
  VpcId: { Type: AWS::EC2::VPC::Id }
  PrivateSubnetId: { Type: AWS::EC2::Subnet::Id }
  ReadOnlyLoadBalancerSubnetId: { Type: AWS::EC2::Subnet::Id }
  BffSecurityGroupId: { Type: AWS::EC2::SecurityGroup::Id }
  DatabaseSecurityGroupId: { Type: AWS::EC2::SecurityGroup::Id }
  # No default: the governed deployment must explicitly supply an AMI that is
  # registered in the target region and matches the signed grant's EIF/PCRs.
  CandidateAmiId: { Type: AWS::EC2::Image::Id }
  ArchiveBucketArn: { Type: String }
  ArchiveBucketName: { Type: String }
  ArchiveKmsKeyArn: { Type: String }
  ArchivePrefix: { Type: String, AllowedPattern: '^[A-Za-z0-9!_.*''()/-]+$' }
  ArchiveRetentionSeconds: { Type: Number, MinValue: 1 }
  AlertTopicArn: { Type: String }
  # These are references only.  No secret value is passed through
  # CloudFormation, EC2 user data, instance tags, or logs.
  RuntimeSecretArn: { Type: String }
  DatabaseSecretArn: { Type: String }
  DatabaseSecretKmsKeyArn: { Type: String }
  DatabaseCaSecretArn: { Type: String }
  DatabaseHost: { Type: String }
  DatabaseName: { Type: String, Default: layrsv2 }
  DatabasePort: { Type: Number, Default: 5432 }
  RpcSecretArn: { Type: String }
  # Read-only historical reconciliation; never enables a fresh Relay route.
  RelayObservationSecretArn: { Type: String, Default: '' }
  OperationalIdentityKmsKeyArn: { Type: String }
  ExecutionMode:
    Type: String
    Default: dormant
    AllowedValues: [dormant, admission-enabled, production-enabled]
  # Persistence remains v70 unless the rollout explicitly selects the
  # restart-compatible hot path or the governed sparse rollback baseline.
  PersistenceFormat:
    Type: String
    Default: v70
    AllowedValues: [v70, v71-hot, v70-rollback-baseline]
  V71ShadowRunId:
    Type: String
    Default: ''
    AllowedPattern: '^(?:|[a-z0-9][a-z0-9-]{0,62})$'
  V71AutoPromote:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  V70RollbackPrefix:
    Type: String
    Default: ''
    AllowedPattern: '^(?:|[A-Za-z0-9!_.*''()/-]+)$'
  WriterGrantBase64:
    Type: String
    Default: ''
    NoEcho: true
  StagedWriterGrantBase64:
    Type: String
    Default: ''
    NoEcho: true
  ApprovedRuntimeBindingBase64:
    Type: String
    Default: ''
    NoEcho: true
  WriterGrantCommitment: { Type: String, Default: '' }
  StagedWriterGrantCommitment: { Type: String, Default: '' }
  ApprovedPcr0: { Type: String, Default: '' }
  ApprovedPcr1: { Type: String, Default: '' }
  ApprovedPcr2: { Type: String, Default: '' }
  BasePoolAddress: { Type: String, AllowedPattern: '^0x[0-9a-fA-F]{40}$' }
  BaseConfirmations: { Type: Number, MinValue: 1 }
  ZenCustodyEnabled: { Type: String, Default: 'false', AllowedValues: ['true', 'false'] }
  ZenCustodyUrl: { Type: String, Default: 'https://api.layrs.xyz', AllowedPattern: '^https://[A-Za-z0-9.-]+(?::[0-9]+)?$' }
  HorizenZenPoolAddress: { Type: String, Default: '0x4B31ad17e964cB6Da440B28405AB110eaF7b52A0', AllowedPattern: '^0x[0-9a-fA-F]{40}$' }
  HorizenConfirmations: { Type: Number, Default: 20, MinValue: 1 }
  UsdcCustodyEnabled: { Type: String, Default: 'false', AllowedValues: ['true', 'false'] }
  UsdcRpcSecretArn: { Type: String, Default: '' }
  # The parent reads the exact configurationJson consumed and hash-pinned by
  # the BFF. UsdcMaximumSubsidyAtomic is a visible deployment guard only; it
  # is never a second runtime source for the cap.
  UsdcPhase1ConfigurationSecretArn: { Type: String, Default: '' }
  UsdcPhase1ConfigurationSha256: { Type: String, Default: '', AllowedPattern: '^(?:|[a-f0-9]{64})$' }
  UsdcLedgerWalletAddress: { Type: String, Default: '', AllowedPattern: '^(?:0x[0-9a-f]{40})?$' }
  UsdcAdministratorPublicKeyDerBase64: { Type: String, Default: '', AllowedPattern: '^(?:[A-Za-z0-9+/]{100,255}={0,2})?$' }
  UsdcMaximumSubsidyAtomic: { Type: Number, Default: 50000, AllowedValues: [50000] }
  UsdcMaximumBridgeFeeWei: { Type: Number, Default: 100000000000000, MinValue: 1 }
  ArbitrumConfirmations: { Type: Number, Default: 1, AllowedValues: [1] }
  EthereumConfirmations: { Type: Number, Default: 12, MinValue: 1 }
  PolygonConfirmations: { Type: Number, Default: 128, MinValue: 1 }
  TempoConfirmations: { Type: Number, Default: 1, MinValue: 1 }
  UnifiedDepositsEnabled: { Type: String, Default: 'false', AllowedValues: ['true', 'false'] }
  UnifiedRpcSecretArn: { Type: String, Default: '' }
  UnifiedEthereumConfirmations: { Type: Number, Default: 12, MinValue: 1, MaxValue: 10000 }
  UnifiedBaseConfirmations: { Type: Number, Default: 20, MinValue: 1, MaxValue: 10000 }
  UnifiedArbitrumConfirmations: { Type: Number, Default: 20, MinValue: 1, MaxValue: 10000 }
  UnifiedOptimismConfirmations: { Type: Number, Default: 20, MinValue: 1, MaxValue: 10000 }
  UnifiedPolygonConfirmations: { Type: Number, Default: 20, MinValue: 1, MaxValue: 10000 }
  UnifiedBnbConfirmations: { Type: Number, Default: 15, MinValue: 1, MaxValue: 10000 }
  UnifiedHorizenConfirmations: { Type: Number, Default: 20, MinValue: 1, MaxValue: 10000 }
  # A dormant verifier may run to support attestation and health checks, but
  # its process mode remains `dormant` and has no writer authority.
  DormantRuntimeDesiredCapacity: { Type: Number, Default: 1, MinValue: 0, MaxValue: 1 }
Rules:
  UsdcCustodyRequiresProductionBindings:
    RuleCondition: !Equals [!Ref UsdcCustodyEnabled, 'true']
    Assertions:
      - Assert: !And
          - !Equals [!Ref ExecutionMode, production-enabled]
          - !Not [!Equals [!Ref UsdcRpcSecretArn, '']]
          - !Not [!Equals [!Ref UsdcPhase1ConfigurationSecretArn, '']]
          - !Not [!Equals [!Ref UsdcPhase1ConfigurationSha256, '']]
          - !Not [!Equals [!Ref UsdcLedgerWalletAddress, '']]
          - !Not [!Equals [!Ref UsdcLedgerWalletAddress, '0x0000000000000000000000000000000000000000']]
          - !Not [!Equals [!Ref UsdcAdministratorPublicKeyDerBase64, '']]
          - !Not [!Equals [!Ref RelayObservationSecretArn, '']]
        AssertDescription: P1 requires the production writer, exact RPC secret, custody address and public link authority.
  UnifiedDepositsRequireProductionBindings:
    RuleCondition: !Equals [!Ref UnifiedDepositsEnabled, 'true']
    Assertions:
      - Assert: !And
          - !Equals [!Ref ExecutionMode, production-enabled]
          - !Not [!Equals [!Ref UnifiedRpcSecretArn, '']]
          - !Equals [!Ref ZenCustodyEnabled, 'true']
        AssertDescription: Unified deposits require the production writer, unified RPC secret and Horizen ZEN finality adapter.
Conditions:
  FinancialWriterEnabled: !Equals [!Ref ExecutionMode, production-enabled]
  RelayObservationConfigured: !Not [!Equals [!Ref RelayObservationSecretArn, '']]
  UsdcCustodyActive: !Equals [!Ref UsdcCustodyEnabled, 'true']
  UnifiedDepositsActive: !Equals [!Ref UnifiedDepositsEnabled, 'true']
Resources:
  RuntimeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /layrs/direct-execution/runtime, RetentionInDays: 365 }
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: 'sts:AssumeRole' }]
      Policies:
        - PolicyName: direct-runtime-dormant-archive-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:GetBucketObjectLockConfiguration, s3:GetObjectRetention, s3:PutObjectRetention]
                Resource: [!Ref ArchiveBucketArn, !Sub '${ArchiveBucketArn}/*']
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !Ref ArchiveKmsKeyArn
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !Ref DatabaseSecretKmsKeyArn
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: !Ref OperationalIdentityKmsKeyArn
                Condition:
                  StringEquals:
                    kms:RecipientAttestation:PCR0: !Ref ApprovedPcr0
                    kms:RecipientAttestation:PCR1: !Ref ApprovedPcr1
                    kms:RecipientAttestation:PCR2: !Ref ApprovedPcr2
                    kms:EncryptionContext:layrs-runtime: layrs.direct-execution.v1
                    kms:EncryptionContext:layrs-epoch: layrs-opening-epoch-20260911-941107537728c98b
                    kms:EncryptionContext:layrs-writer-grant:
                      - !Ref WriterGrantCommitment
                      - !Ref StagedWriterGrantCommitment
              # A measured-runtime upgrade may rewrap the exact prior root-key
              # ciphertext under the newly signed grant context. KMS performs
              # this entirely inside the service; the parent cannot receive
              # plaintext, change keys, or re-encrypt to another CMK.
              - Effect: Allow
                Action: [kms:ReEncryptFrom, kms:ReEncryptTo]
                Resource: !Ref OperationalIdentityKmsKeyArn
                Condition:
                  Bool:
                    kms:ReEncryptOnSameKey: 'true'
              - Effect: Allow
                Action: [kms:DescribeKey]
                Resource: !Ref OperationalIdentityKmsKeyArn
              # The existing RPC reference is encrypted by the established
              # operational-identity CMK.  This separate Secrets Manager-only
              # decrypt duty cannot release runtime key material directly and
              # cannot satisfy the Recipient-gated writer-key statement above.
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !Ref OperationalIdentityKmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
              # The read-only runtime may retrieve only its existing Privy
              # application configuration.  It cannot list,
              # create, update, rotate, or delete Secrets Manager objects.
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource:
                  - !Ref RuntimeSecretArn
                  - !Ref DatabaseSecretArn
                  - !Ref DatabaseCaSecretArn
                  - !Ref RpcSecretArn
                  - !If [RelayObservationConfigured, !Ref RelayObservationSecretArn, !Ref 'AWS::NoValue']
                  - !If [UsdcCustodyActive, !Ref UsdcRpcSecretArn, !Ref 'AWS::NoValue']
                  - !If [UsdcCustodyActive, !Ref UsdcPhase1ConfigurationSecretArn, !Ref 'AWS::NoValue']
                  - !If [UnifiedDepositsActive, !Ref UnifiedRpcSecretArn, !Ref 'AWS::NoValue']
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt RuntimeLogGroup.Arn
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
  RuntimeProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref RuntimeRole] }
  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Direct runtime accepts only BFF health and command traffic
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8443, ToPort: 8443, SourceSecurityGroupId: !Ref ReadOnlyLoadBalancerSecurityGroup }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: !Ref DatabasePort, ToPort: !Ref DatabasePort, DestinationSecurityGroupId: !Ref DatabaseSecurityGroupId }
  RuntimeToProjectionIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref DatabasePort
      ToPort: !Ref DatabasePort
      SourceSecurityGroupId: !Ref RuntimeSecurityGroup
      Description: Attested direct runtime signed projection only
  ReadOnlyLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Direct runtime read-only NLB accepts only the dedicated BFF
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8443, ToPort: 8443, SourceSecurityGroupId: !Ref BffSecurityGroupId }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 8443, ToPort: 8443, CidrIp: 0.0.0.0/0 }
  DormantLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref CandidateAmiId
        InstanceType: m6i.xlarge
        IamInstanceProfile: { Arn: !GetAtt RuntimeProfile.Arn }
        SecurityGroupIds: [!Ref RuntimeSecurityGroup]
        EnclaveOptions: { Enabled: true }
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # The process obtains secret values only in memory and writes a
            # root-only EnvironmentFile.  It never emits a value to stdout,
            # stderr, CloudFormation, EC2 metadata, or a tag.
            set -euo pipefail
            install -d -m 0700 /etc/layrs-opening
            /usr/bin/python3 - <<'PY'
            import json
            import base64
            import hashlib
            import os
            import subprocess
            import tempfile
            from urllib.parse import quote

            def secret(secret_arn):
                raw = subprocess.check_output(
                    ["aws", "secretsmanager", "get-secret-value", "--region", "${AWS::Region}",
                     "--secret-id", secret_arn, "--query", "SecretString", "--output", "text"],
                    stderr=subprocess.DEVNULL,
                    text=True,
                )
                value = json.loads(raw)
                if not isinstance(value, dict):
                    raise RuntimeError("secret object required")
                return value

            def required(value, key):
                item = value.get(key)
                if not isinstance(item, str) or not item:
                    raise RuntimeError("required runtime secret field unavailable")
                return item

            runtime = secret("${RuntimeSecretArn}")
            database = secret("${DatabaseSecretArn}")
            database_ca = secret("${DatabaseCaSecretArn}")
            rpc = secret("${RpcSecretArn}")
            database_url = "postgresql://{}:{}@{}:{}/{}?sslmode=require".format(
                quote(required(database, "username"), safe=""),
                quote(required(database, "password"), safe=""),
                "${DatabaseHost}",
                "${DatabasePort}",
                quote("${DatabaseName}", safe=""),
            )
            values = {
                "LAYRS_DIRECT_EXECUTION_MODE": "${ExecutionMode}",
                "LAYRS_DIRECT_PERSISTENCE_FORMAT": "${PersistenceFormat}",
                # This guarded VPC listener serves only signed, encrypted
                # balance reads from the dedicated BFF.  The enclave remains
                # dormant and the parent rejects every financial command.
                "LAYRS_DIRECT_BIND_ADDRESS": "0.0.0.0",
                "LAYRS_DIRECT_READ_ONLY_VPC_BIND": "true",
                "LAYRS_DIRECT_ARCHIVE_BACKEND": "s3-object-lock",
                "LAYRS_DIRECT_ARCHIVE_BUCKET": "${ArchiveBucketName}",
                "LAYRS_DIRECT_ARCHIVE_PREFIX": "${ArchivePrefix}",
                "LAYRS_DIRECT_ARCHIVE_KMS_KEY_ID": "${ArchiveKmsKeyArn}",
                "LAYRS_DIRECT_ARCHIVE_RETENTION_SECONDS": "${ArchiveRetentionSeconds}",
                "LAYRSV2_PRIVY_APP_ID": required(runtime, "privyAppId"),
                "LAYRSV2_PRIVY_APP_SECRET": required(runtime, "privyAppSecret"),
                "LAYRS_DIRECT_PROJECTION_DATABASE_URL": database_url,
                "LAYRS_DIRECT_PROJECTION_DATABASE_CA_PEM": required(database_ca, "databaseCaPem"),
                "LAYRS_DIRECT_KEY_RELEASE_KMS_KEY_ID": "${OperationalIdentityKmsKeyArn}",
                "LAYRS_DIRECT_COMMIT_ACK_KEY_HEX": hashlib.sha256(
                    b"layrs.direct-execution.durability-ack.v1\\0" +
                    required(runtime, "receiptShareHmacSecret").encode("utf-8")
                ).hexdigest(),
            }
            if "${V71ShadowRunId}":
                values["LAYRS_DIRECT_V71_SHADOW_RUN_ID"] = "${V71ShadowRunId}"
            if "${V71AutoPromote}" == "true":
                values["LAYRS_DIRECT_V71_AUTO_PROMOTE"] = "true"
            if "${V70RollbackPrefix}":
                values["LAYRS_DIRECT_V70_ROLLBACK_PREFIX"] = "${V70RollbackPrefix}"
            if "${ExecutionMode}" in ("admission-enabled", "production-enabled"):
                # EnvironmentFile cannot preserve pretty-printed JSON record
                # separators: escaped newlines outside JSON strings are not
                # valid JSON after systemd loads the value.  Parse and emit a
                # canonical single-line representation before quoting it for
                # systemd.  This changes only parent bootstrap configuration;
                # it does not alter the measured enclave/runtime binaries.
                writer_grant = json.dumps(
                    json.loads(base64.b64decode("${WriterGrantBase64}", validate=True).decode("utf-8")),
                    separators=(",", ":"),
                )
                runtime_binding = json.dumps(
                    json.loads(base64.b64decode("${ApprovedRuntimeBindingBase64}", validate=True).decode("utf-8")),
                    separators=(",", ":"),
                )
                values.update({
                    "LAYRS_DIRECT_WRITER_GRANT_JSON": writer_grant,
                    "LAYRS_DIRECT_APPROVED_RUNTIME_BINDING_JSON": runtime_binding,
                })
                if "${StagedWriterGrantBase64}":
                    values["LAYRS_DIRECT_STAGED_WRITER_GRANT_JSON"] = json.dumps(
                        json.loads(base64.b64decode("${StagedWriterGrantBase64}", validate=True).decode("utf-8")),
                        separators=(",", ":"),
                    )
            if "${ExecutionMode}" == "production-enabled":
                if "${RelayObservationSecretArn}":
                    relay_observation = secret("${RelayObservationSecretArn}")
                    values["LAYRSV2_RELAY_API_KEY"] = required(relay_observation, "apiKey")
                values.update({
                    "LAYRS_DIRECT_CUSTODY_PROVIDER": "privy-base-existing-pool-ledger",
                    "LAYRSV2_BASE_POOL_LEDGER_PRIVY_ADDRESS": required(runtime, "basePoolLedgerPrivyAddress"),
                    "LAYRSV2_BASE_POOL_LEDGER_PRIVY_WALLET_ID": required(runtime, "basePoolLedgerPrivyWalletId"),
                    "LAYRSV2_BASE_POOL_LEDGER_PRIVY_AUTH_PRIVATE_KEY_PEM": required(runtime, "basePoolLedgerPrivyAuthPrivateKeyPem"),
                    "LAYRSV2_BASE_POOL_ADDRESS": "${BasePoolAddress}",
                    "LAYRSV2_BASE_RPC_URL": required(rpc, "baseRpcUrl"),
                    "LAYRSV2_BASE_CONFIRMATIONS": "${BaseConfirmations}",
                })
                if "${ZenCustodyEnabled}" == "true":
                    values.update({
                        "LAYRS_DIRECT_ZEN_CUSTODY_ENABLED": "true",
                        "LAYRS_DIRECT_ZEN_CUSTODY_URL": "${ZenCustodyUrl}",
                        "LAYRSV2_HORIZEN_ZEN_POOL_ADDRESS": "${HorizenZenPoolAddress}",
                        "LAYRSV2_HORIZEN_POOL_LEDGER_PRIVY_WALLET_ID": required(runtime, "horizenPoolLedgerPrivyWalletId"),
                        "LAYRSV2_HORIZEN_POOL_LEDGER_PRIVY_ADDRESS": required(runtime, "horizenPoolLedgerPrivyAddress"),
                        "LAYRSV2_HORIZEN_RPC_URL": required(rpc, "horizenRpcUrl"),
                        "LAYRSV2_HORIZEN_CONFIRMATIONS": "${HorizenConfirmations}",
                    })
                if "${UnifiedDepositsEnabled}" == "true":
                    unified_rpc = secret("${UnifiedRpcSecretArn}")
                    unified_chains = {
                        "ethereum": ("1", "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48", "${UnifiedEthereumConfirmations}"),
                        "base": ("8453", "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913", "${UnifiedBaseConfirmations}"),
                        "arbitrum": ("42161", "0xaf88d065e77c8cc2239327c5edb3a432268e5831", "${UnifiedArbitrumConfirmations}"),
                        "optimism": ("10", "0x0b2c639c533813f4aa9d7837caf62653d097ff85", "${UnifiedOptimismConfirmations}"),
                        "polygon": ("137", "0x3c499c542cef5e3811e1192ce70d8cc03d5c3359", "${UnifiedPolygonConfirmations}"),
                        "bnb": ("56", "0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d", "${UnifiedBnbConfirmations}"),
                        "horizen": ("26514", "0xdf7108f8b10f9b9ec1aba01cca057268cbf86b6c", "${UnifiedHorizenConfirmations}"),
                    }
                    for chain, (chain_id, token, confirmations) in unified_chains.items():
                        prefix = "LAYRS_UNIFIED_" + chain.upper()
                        values[prefix + "_RPC_URL"] = required(unified_rpc, chain + "RpcUrl")
                        values[prefix + "_CHAIN_ID"] = chain_id
                        values[prefix + "_TOKEN_ADDRESS"] = token
                        values[prefix + "_CONFIRMATIONS"] = confirmations
                        fallback = unified_rpc.get(chain + "RpcFallbackUrl")
                        if chain != "horizen" and isinstance(fallback, str) and fallback:
                            values[prefix + "_RPC_FALLBACK_URL"] = fallback
                    values.update({
                        "LAYRS_UNIFIED_DEPOSITS_ENABLED": "true",
                        "LAYRS_UNIFIED_USDC_FINALITY_ENABLED": "true",
                        "LAYRS_UNIFIED_BASE_ZEN_TOKEN_ADDRESS": "0xf43eb8de897fbc7f2502483b2bef7bb9ea179229",
                        "LAYRS_UNIFIED_HORIZEN_ZEN_TOKEN_ADDRESS": "0x57da2d504bf8b83ef304759d9f2648522d7a9280",
                    })
                if "${UsdcCustodyEnabled}" == "true":
                    # Read-only proof verification and public administrative
                    # authority only. No P1 financial/operator/admin PEM is
                    # supplied to this parent by the USDC release bindings.
                    usdc_rpc = secret("${UsdcRpcSecretArn}")
                    phase1_raw = required(secret("${UsdcPhase1ConfigurationSecretArn}"), "configurationJson")
                    if hashlib.sha256(phase1_raw.encode("utf-8")).hexdigest() != "${UsdcPhase1ConfigurationSha256}":
                        raise RuntimeError("USDC Phase-1 configuration hash mismatch")
                    phase1 = json.loads(phase1_raw)
                    phase1_limits = phase1.get("limits") if isinstance(phase1, dict) else None
                    phase1_subsidy = phase1_limits.get("maximumSubsidyAtomic") if isinstance(phase1_limits, dict) else None
                    if not isinstance(phase1_subsidy, str) or phase1_subsidy != "${UsdcMaximumSubsidyAtomic}":
                        raise RuntimeError("USDC Phase-1 subsidy cap mismatch")
                    values.update({
                        "LAYRS_DIRECT_USDC_CUSTODY_ENABLED": "true",
                        "LAYRSV2_HORIZEN_RPC_URL": required(usdc_rpc, "horizenRpcUrl"),
                        "LAYRSV2_ARBITRUM_RPC_URL": required(usdc_rpc, "arbitrumRpcUrl"),
                        "LAYRSV2_BASE_RPC_URL": required(usdc_rpc, "baseRpcUrl"),
                        "LAYRSV2_ETHEREUM_RPC_URL": required(usdc_rpc, "ethereumRpcUrl"),
                        "LAYRSV2_POLYGON_RPC_URL": required(usdc_rpc, "polygonRpcUrl"),
                        "LAYRSV2_TEMPO_RPC_URL": required(usdc_rpc, "tempoRpcUrl"),
                        "LAYRSV2_SOLANA_RPC_URL": required(usdc_rpc, "solanaRpcUrl"),
                        "LAYRSV2_ROBINHOOD_RPC_URL": required(usdc_rpc, "robinhoodRpcUrl"),
                        "LAYRSV2_HORIZEN_CONFIRMATIONS": "${HorizenConfirmations}",
                        "LAYRSV2_ARBITRUM_CONFIRMATIONS": "${ArbitrumConfirmations}",
                        "LAYRSV2_BASE_CONFIRMATIONS": "${BaseConfirmations}",
                        "LAYRSV2_ETHEREUM_CONFIRMATIONS": "${EthereumConfirmations}",
                        "LAYRSV2_POLYGON_CONFIRMATIONS": "${PolygonConfirmations}",
                        "LAYRSV2_TEMPO_CONFIRMATIONS": "${TempoConfirmations}",
                        "LAYRS_DIRECT_USDC_LEDGER_WALLET_ADDRESS": "${UsdcLedgerWalletAddress}",
                        "LAYRS_DIRECT_USDC_MAX_SUBSIDY_ATOMIC": phase1_subsidy,
                        "LAYRS_DIRECT_USDC_MAX_BRIDGE_FEE_WEI": "${UsdcMaximumBridgeFeeWei}",
                        "LAYRS_DIRECT_USDC_ADMIN_PUBLIC_KEY_DER_BASE64": "${UsdcAdministratorPublicKeyDerBase64}",
                    })
            def quote(value):
                # systemd EnvironmentFile consumes one shell-like escaping
                # layer.  Escape each literal backslash exactly once and each
                # double quote exactly once; double-escaping leaves JSON as
                # {\"key\":...} in the service environment and makes the
                # governed grant/binding fail closed during bootstrap.
                return '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n') + '"'
            fd, temporary = tempfile.mkstemp(prefix="direct-runtime.", dir="/etc/layrs-opening")
            try:
                with os.fdopen(fd, "w", encoding="utf-8") as out:
                    for key, value in values.items():
                        out.write(key + "=" + quote(value) + "\n")
                    out.flush()
                    os.fsync(out.fileno())
                os.chmod(temporary, 0o600)
                os.replace(temporary, "/etc/layrs-opening/direct-runtime.env")
            finally:
                if os.path.exists(temporary):
                    os.unlink(temporary)
            PY
            systemctl restart layrs-opening-enclave.service
            systemctl restart layrs-opening-parent.service
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Project, Value: Layrs }, { Key: Environment, Value: production-direct }, { Key: WriterEnabled, Value: !If [FinancialWriterEnabled, 'true', 'false'] }, { Key: TransactionModel, Value: layrs.direct-execution.v1 }, { Key: CandidateAmiId, Value: !Ref CandidateAmiId }]
  DormantAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: [!Ref PrivateSubnetId]
      LaunchTemplate: { LaunchTemplateId: !Ref DormantLaunchTemplate, Version: !GetAtt DormantLaunchTemplate.LatestVersionNumber }
      MinSize: '0'
      MaxSize: '1'
      DesiredCapacity: !Ref DormantRuntimeDesiredCapacity
      HealthCheckType: ELB
      # The measured legacy restore exceeded fourteen minutes. Keep the A0
      # incident-mitigation grace so ELB health cannot recycle a valid host
      # while either the candidate or rollback parent is still restoring.
      HealthCheckGracePeriod: 3600
      TargetGroupARNs: [!Ref ReadOnlyRuntimeTargetGroup]
      Tags: [{ Key: WriterEnabled, Value: !If [FinancialWriterEnabled, 'true', 'false'], PropagateAtLaunch: true }]
  ReadOnlyRuntimeLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: layrs-direct-readonly
      Scheme: internal
      Type: network
      IpAddressType: ipv4
      SecurityGroups: [!Ref ReadOnlyLoadBalancerSecurityGroup]
      Subnets: [!Ref PrivateSubnetId, !Ref ReadOnlyLoadBalancerSubnetId]
  ReadOnlyRuntimeTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: layrs-direct-readonly
      VpcId: !Ref VpcId
      TargetType: instance
      Protocol: TCP
      Port: 8443
      TargetGroupAttributes:
        - { Key: load_balancing.cross_zone.enabled, Value: 'true' }
      HealthCheckProtocol: HTTP
      HealthCheckPort: '8443'
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      Matcher: { HttpCode: '200-399' }
      HealthyThresholdCount: 3
      # A verified cold restore has taken more than four minutes. Preserve the
      # live incident mitigation so normal initial health does not cross the
      # unhealthy boundary before the parent begins listening.
      UnhealthyThresholdCount: 8
  ReadOnlyRuntimeListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ReadOnlyRuntimeLoadBalancer
      Protocol: TCP
      Port: 8443
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref ReadOnlyRuntimeTargetGroup }]
  RuntimeHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: layrs-production-direct-runtime-health-missing
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopicArn]
Outputs:
  ReadOnlyRuntimeEndpoint:
    Description: Private, encrypted balance-read endpoint for the dedicated BFF.
    Value: !Sub 'http://${ReadOnlyRuntimeLoadBalancer.DNSName}:8443'
  ReadOnlyRuntimeTargetGroupArn:
    Value: !Ref ReadOnlyRuntimeTargetGroup
