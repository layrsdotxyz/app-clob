[package]
name = "layrsv2-enclave-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["standalone-enclave-runtime"]
standalone-enclave-runtime = []

[lib]
name = "clob_service"
path = "src/lib.rs"

[[bin]]
name = "layrs-enclave"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
aws-lc-rs = "1.16"
aws-nitro-enclaves-nsm-api = "0.5.2"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
ethers-core = { version = "2.0.14", default-features = false }
ethers-signers = { version = "2.0.14", default-features = false }
hex = "0.4"
hmac = "0.12"
layrs-settlement-proof-core = { path = "../../proofs/settlement/core" }
openssl = { version = "0.10", features = ["vendored"] }
rand = "0.8"
rust_decimal = { version = "1.35", features = ["serde-float"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = { version = "0.11", features = ["tags"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
tokio = { version = "1.40", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
tokio-vsock = "0.7.2"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
webpki-roots = "1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
