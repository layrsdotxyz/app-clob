[package]
name = "layrs-direct-execution-v1"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "layrs-direct-enclave"
path = "src/bin/enclave.rs"

[[bin]]
name = "layrs-direct-parent"
path = "src/bin/parent.rs"

[dependencies]
aws-nitro-enclaves-nsm-api = "0.5.2"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.40", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-vsock = "0.7.2"
