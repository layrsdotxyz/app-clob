[package]
name = "layrs-direct-execution-v1"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "layrs-direct-enclave"
path = "src/bin/enclave.rs"

[[bin]]
name = "layrs-direct-parent"
path = "src/bin/parent.rs"

[dependencies]
aws-nitro-enclaves-nsm-api = "0.5.2"
aws-config = "1.8"
aws-sdk-kms = "1.99"
aws-sdk-s3 = "1.99"
aws-smithy-types = "1.3"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
bytes = "1.7"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.1"
hex = "0.4"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
native-tls = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
postgres-native-tls = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "1.0"
tokio = { version = "1.40", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-vsock = "0.7.2"
tokio-postgres = "0.7"
uuid = { version = "1.10", features = ["serde", "v5"] }
zeroize = "1.8"
layrs-clob-service = { path = "../.." }
