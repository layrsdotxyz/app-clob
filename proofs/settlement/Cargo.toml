[workspace]
resolver = "2"
members = ["core", "host", "methods"]

[workspace.dependencies]
anyhow = "1.0"
ciborium = "0.2.2"
hex = "0.4"
risc0-zkvm = { version = "=2.2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true
